# Refresh prices and deploy to GitHub Pages. Runs on every push to main and
# each weekday evening after the COMEX and LME closes, so prices.json always
# holds the last settled day. Nothing is committed back: the fetch starts from
# the live site's prices.json, so a source that fails keeps yesterday's value.
name: Refresh prices and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # start from the deployed prices (falls back to the committed seed)
      - run: curl -fsS https://danielburkhalter.dev/coin-value/prices.json -o prices.json || true

      - run: node scripts/fetch-prices.mjs

      - run: mkdir _site && cp index.html prices.json logo.png _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
